name: Cache bust

on:
  push:
    branches: [main]

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject version query string
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i -E "s|css/style\.css(\?v=[a-f0-9]+)?|css/style.css?v=$SHA|g" index.html
          sed -i -E "s|js/app\.js(\?v=[a-f0-9]+)?|js/app.js?v=$SHA|g" index.html
          sed -i -E "s|favicon\.svg(\?v=[a-f0-9]+)?|favicon.svg?v=$SHA|g" index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "chore: cache bust assets [skip ci]" &&
            git push
          )
